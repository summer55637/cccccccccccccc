  <style>
    html, body { background: #000; overscroll-behavior: none; } /* 純黑=桌機留邊區與頁面同色 */
    /* 📱 iPhone 17 Pro:點帳密欄位整頁被拉扯放大、進遊戲版面偏上底下黑。*/
    /* ⚠ 撤掉 html,body{position:fixed;inset:0}:手機實測整個版面反而往上頂到狀態列下(安全區內縮失效)。只留 16px 與收鍵盤重算。 */
    input, textarea { font-size: 16px !important; }
  </style>
  <script>
    /*       失焦 body.scrollTop=0;鍵盤收完 500ms 後才用「歷史最大高度」重算)。
       原因:iOS「加入桌面」standalone 的鍵盤會擠 innerHeight(Safari 只縮 visualViewport 不會)→ 引擎 resize 把畫布壓矮
       Shell 翻 SHOW_ALL、版面跳掉;鍵盤收起 WebKit 常不復原 innerHeight → 底下黑帶。Cocos EditBox 只對 Android 關
       handleResizeEvent,所以在引擎載入前包住 window 的 resize 監聽補 iOS。 */
    (function () {
      var mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
      var isInput = function (el) { return !!el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA'); };
      var typing = false, baseW = 0, baseH = 0, pending = false;
      /* 打字守門保留(resize 與下面 matchMedia 兩條)——打字中轉向等鍵盤收起(focusout)才補發 resize */
      var add = window.addEventListener;
      window.addEventListener = function (type, fn, opt) {
        if ((type === 'resize' || type === 'orientationchange') && typeof fn === 'function') {
          var wrapped = function (e) {
            if (typing) { pending = true; return; } /* 輸入中:吞掉 */
            if (baseH && window.innerWidth === baseW && window.innerHeight < baseH) { pending = true; return; } /* 鍵盤收了 innerHeight 還沒復原:不縮畫布 */
            return fn.call(window, e);
          };
          return add.call(window, type, wrapped, opt);
        }
        return add.call(window, type, fn, opt);
      };
      /* 📱 引擎轉向走 matchMedia('(orientation: portrait|landscape)') 的 change(screen-adapter _registerEvent → _updateFrame 直接改畫布),不經上面的 resize 包裝
         → 同一套打字守門也包住它:直式打字時鍵盤把可視區壓成寬>高,不准翻畫布(不然 Shell 翻橫版、safe 關掉、EditBox 失焦、打到一半的字消失);focusout 補發的 resize 會讓引擎照實際尺寸重算。
         只包 orientation 那兩條(DPR 的 resolution 查詢是 {once:true} 自己重掛,吞掉就再也收不到) */
      if (window.MediaQueryList && MediaQueryList.prototype) {
        var mqAdd = MediaQueryList.prototype.addEventListener, mqAddL = MediaQueryList.prototype.addListener;
        var isOri = function (mq) { return /orientation/.test((mq && mq.media) || ''); };
        var gate = function (fn) { return function (e) { if (typing || (baseH && window.innerWidth === baseW && window.innerHeight < baseH)) { pending = true; return; } return fn.call(this, e); }; };
        if (mqAdd) MediaQueryList.prototype.addEventListener = function (type, fn, opt) { return mqAdd.call(this, type, (type === 'change' && typeof fn === 'function' && isOri(this)) ? gate(fn) : fn, opt); };
        if (mqAddL) MediaQueryList.prototype.addListener = function (fn) { return mqAddL.call(this, (typeof fn === 'function' && isOri(this)) ? gate(fn) : fn); };
      }
      /* ⌨ 給 Shell 看「鍵盤開著或還沒收完」(打字中,或收鍵盤後 innerHeight 還沒回原高):橫版這段時間不重算安全區(sys.getSafeAreaRect 吃當下 innerHeight,畫布被上面守門擋著沒變) */
      window.GOLINE_KB_HOLD = function () { return typing || (baseH > 0 && window.innerWidth === baseW && window.innerHeight < baseH); };
      var scrollTop0 = function () { try { window.scrollTo(0, 0); document.documentElement.scrollTop = 0; document.body.scrollTop = 0; } catch (e) {} };
      document.addEventListener('focusin', function (e) {
        if (!isInput(e.target)) return;
        if (!typing) { baseW = window.innerWidth; baseH = window.innerHeight; }
        typing = true;
      }, true);
      document.addEventListener('focusout', function (e) {
        if (!isInput(e.target)) return;
        var t0 = Date.now();
        var tick = function () {
          if (isInput(document.activeElement)) return; /* 換到下一格輸入框:還在輸入,守門繼續 */
          var restored = !mobile || window.innerHeight >= baseH || window.innerWidth !== baseW;
          if (!restored && Date.now() - t0 < 1500) { setTimeout(tick, 50); return; }
          typing = false;
          scrollTop0();
          if (restored) {
            baseW = 0; baseH = 0;
            if (pending) { pending = false; try { window.dispatchEvent(new Event('resize')); } catch (e2) {} }
          }
          /* 沒復原:保留 baseH 守門,等 innerHeight 真的回來的那次 resize 才放行(畫布維持滿版,不留黑帶) */
        };
        setTimeout(tick, 50);
      }, true);
      window.addEventListener('orientationchange', function () { baseW = 0; baseH = 0; setTimeout(scrollTop0, 300); });
    })();
  </script>
