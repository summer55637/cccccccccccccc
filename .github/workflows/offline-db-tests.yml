name: Offline character IndexedDB tests

on:
  push:
    branches:
      - offline/local-character-system
    paths:
      - "offline/**"
      - ".github/workflows/offline-db-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-db-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  indexeddb-browser-tests:
    name: Chromium IndexedDB CRUD and persistence
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Test safe offline release packaging
        run: python offline/tests/release-package.test.py
      - name: Test original Cocos release packaging contract
        run: python offline/tests/original-release.test.py

      - name: Build allowlisted offline release archive
        run: python offline/tools/build-release.py --output "$RUNNER_TEMP/offline-adventure-release.zip"

      - name: Install Playwright
        working-directory: offline
        run: npm install --no-save --no-package-lock playwright

      - name: Install Chromium, Firefox and WebKit
        working-directory: offline
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Prepare bounded filesystem for real quota exhaustion
        run: |
          sudo mkdir -p /mnt/chrome-quota-test
          sudo mount -t tmpfs -o size=512M,mode=1777 tmpfs /mnt/chrome-quota-test
          df -h /mnt/chrome-quota-test

      - name: Run real-browser IndexedDB and offline tests
        env:
          CHROME_QUOTA_TEST_ROOT: /mnt/chrome-quota-test
        run: node offline/tests/run-browser-tests.mjs

      - name: Run Firefox and WebKit compatibility smoke tests
        run: node offline/tests/run-cross-browser-smoke.mjs

      - name: Upload verified offline release archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: offline-adventure-release-${{ github.sha }}
          path: ${{ runner.temp }}/offline-adventure-release.zip
          if-no-files-found: error
          retention-days: 7
