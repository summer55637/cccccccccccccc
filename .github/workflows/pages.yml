name: Publish original Cocos client to GitHub Pages

on:
  push:
    branches:
      - offline/local-character-system
    paths:
      - ".github/workflows/pages.yml"
      - "client/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout original client
        uses: actions/checkout@v4
        with:
          ref: offline/local-character-system
          lfs: false

      - name: Assemble original Cocos client at Pages root
        env:
          SITE_DIR: ${{ runner.temp }}/pages-site
        run: |
          python - <<'PY'
          import os
          import shutil
          from pathlib import Path

          repo = Path.cwd()
          client = repo / "client"
          site = Path(os.environ["SITE_DIR"])
          if not (client / "index.html").is_file():
              raise SystemExit("Missing original Cocos client/index.html")
          if not (client / "src/settings.57846.json").is_file():
              raise SystemExit("Missing Cocos runtime settings")
          if not (client / "assets/main/config.3e757.json").is_file():
              raise SystemExit("Missing original main asset bundle")
          site.mkdir(parents=True, exist_ok=True)

          def ignore(directory, names):
              here = Path(directory).resolve()
              ignored = set()
              if here == client.resolve():
                  ignored.update({
                      "decoded_strings_adapter.json",
                      "decoded_strings_main.json",
                      "manifest_mapping.json",
                      "texture_packer_atlas.json",
                  })
              if here == (client / "assets" / "main").resolve():
                  ignored.add("index.deobf.js")
              if here == (client / "src" / "assets" / "scripts" / "net").resolve():
                  ignored.add("goline-adapter.deobf.js")
              return ignored

          # The original client requests /assets-packs/* and /api/* from the
          # origin root, so its files must be hosted at the Pages root as well.
          shutil.copytree(client, site, dirs_exist_ok=True, ignore=ignore)
          (site / ".nojekyll").write_text("", encoding="utf-8")

          # Keep old direct URLs working without duplicating the 244 MB pack files.
          compat = site / "client"
          compat.mkdir(exist_ok=True)
          (compat / "index.html").write_text(
              '<!doctype html><html lang="zh-Hant"><meta charset="utf-8">'
              '<meta http-equiv="refresh" content="0;url=../index.html">'
              '<title>小樹</title><a href="../index.html">進入小樹</a></html>',
              encoding="utf-8",
          )
          game = site / "game"
          game.mkdir(exist_ok=True)
          (game / "index.html").write_text(
              '<!doctype html><html lang="zh-Hant"><meta charset="utf-8">'
              '<meta http-equiv="refresh" content="0;url=../index.html">'
              '<title>小樹</title><a href="../index.html">進入小樹</a></html>',
              encoding="utf-8",
          )

          required = [
              site / "index.html",
              site / "src/settings.57846.json",
              site / "cocos-js/cc.03aac.js",
              site / "assets/internal/config.9e58a.json",
              site / "assets/resources/config.caeb6.json",
              site / "assets/main/config.3e757.json",
              site / "src/assets/scripts/net/goline-adapter.8231b.js",
              site / "assets-packs/packs-manifest.json",
          ]
          missing = [str(p.relative_to(site)) for p in required if not p.is_file()]
          if missing:
              raise SystemExit("Missing runtime files: " + ", ".join(missing))
          total = sum(p.stat().st_size for p in site.rglob("*") if p.is_file())
          if total > 1_000_000_000:
              raise SystemExit(f"Pages site exceeds 1 GB: {total} bytes")
          count = sum(1 for p in site.rglob("*") if p.is_file())
          print(f"Prepared root-hosted original Cocos runtime: {count} files, {total / 1048576:.1f} MiB")
          PY

      - name: Set up Node for browser smoke test
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Chromium smoke-test browser
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium

      - name: Verify original Cocos launch scene and map pack paths in Chromium
        env:
          SITE_DIR: ${{ runner.temp }}/pages-site
          SCREENSHOT_PATH: ${{ runner.temp }}/original-client-smoke.png
        run: node .github/scripts/smoke-original-client.mjs

      - name: Upload original client smoke-test screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-cocos-smoke-test
          path: ${{ runner.temp }}/original-client-smoke.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
