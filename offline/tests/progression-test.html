<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>角色成長系統測試</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, "Noto Sans TC", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #101720; color: #e7edf4; }
    main { width: min(760px, 100%); padding: 24px; box-sizing: border-box; border: 1px solid #344253; border-radius: 16px; background: #182330; }
    h1 { margin: 0 0 8px; font-size: 1.5rem; }
    p { color: #bac7d5; line-height: 1.65; }
    button { border: 0; border-radius: 9px; padding: 12px 18px; background: #c49a57; color: #1a1a1a; font-weight: 700; cursor: pointer; }
    #status { margin-top: 16px; font-weight: 700; }
    pre { min-height: 180px; max-height: 420px; overflow: auto; white-space: pre-wrap; background: #0d141d; border: 1px solid #344253; border-radius: 10px; padding: 14px; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <h1>角色成長系統測試</h1>
    <p>使用獨立的臨時 IndexedDB，測試職業初始能力值、經驗值、升級、HP／MP 成長、能力點數分配及等級上限。完成後會刪除測試資料庫。</p>
    <button id="run" type="button">執行成長系統測試</button>
    <div id="status" role="status" aria-live="polite">尚未執行</div>
    <pre id="log" aria-live="polite">等待測試。</pre>
  </main>
  <script type="module">
    import { runProgressionTests } from "./progression.test.mjs";
    const button = document.querySelector("#run");
    const status = document.querySelector("#status");
    const log = document.querySelector("#log");
    button.addEventListener("click", async () => {
      button.disabled = true;
      log.textContent = "開始測試……\\n";
      status.textContent = "測試執行中";
      try {
        const result = await runProgressionTests({ onLog: line => { log.textContent += line + "\\n"; } });
        status.textContent = "成功：" + result.passed + " 項成長系統測試全部通過";
      } catch (error) {
        status.textContent = "測試失敗，請查看錯誤訊息";
        log.textContent += "\\n錯誤：" + (error?.message || String(error)) + "\\n";
        console.error(error);
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
