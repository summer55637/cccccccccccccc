<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>單機角色資料庫測試</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, "Noto Sans TC", sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101720; color: #e7edf4; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
    main { width: min(760px, 100%); background: #182330; border: 1px solid #344253; border-radius: 16px; padding: 24px; box-sizing: border-box; }
    h1 { margin: 0 0 8px; font-size: 1.5rem; }
    p { color: #bac7d5; line-height: 1.65; }
    button { border: 0; border-radius: 10px; padding: 12px 18px; background: #c49a57; color: #1a1a1a; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .5; cursor: wait; }
    #status { margin-top: 16px; font-weight: 700; }
    pre { min-height: 180px; max-height: 420px; overflow: auto; white-space: pre-wrap; background: #0d141d; border: 1px solid #344253; border-radius: 10px; padding: 14px; color: #d6e0eb; line-height: 1.6; }
    .note { font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <h1>單機角色資料庫測試</h1>
    <p>這個測試會使用一次性的臨時 IndexedDB，測試建立、讀取、更新、存檔、重新開啟及刪除。測試結束後會自動清除臨時資料，不會接觸正式存檔或原遊戲伺服器。</p>
    <button id="run" type="button">執行完整測試</button>
    <div id="status" role="status" aria-live="polite">尚未執行</div>
    <pre id="log" aria-live="polite">等待測試。</pre>
    <p class="note">請透過 localhost 或 HTTPS 開啟。若瀏覽器封鎖 IndexedDB，測試會顯示錯誤原因。</p>
  </main>
  <script type="module">
    import { runIndexedDBTests } from "./indexeddb.test.js";
    const button = document.querySelector("#run");
    const status = document.querySelector("#status");
    const log = document.querySelector("#log");
    button.addEventListener("click", async () => {
      button.disabled = true;
      log.textContent = "開始測試……\n";
      status.textContent = "測試執行中";
      try {
        const result = await runIndexedDBTests({ onLog: line => { log.textContent += `${line}\n`; } });
        status.textContent = `成功：${result.passed} 項測試全部通過`;
      } catch (error) {
        status.textContent = "測試失敗，請查看錯誤訊息";
        log.textContent += `\n錯誤：${error?.message || String(error)}\n`;
        console.error(error);
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
